<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Шумомер</title>
    <style>
        /* Базовый сброс и настройка темной темы */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            padding: 20px;
        }

        #start-screen p {
            color: #aaaaaa;
            font-size: 1.1rem;
            max-width: 300px;
        }

        .btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
        }

        .btn:hover {
            background-color: #1976D2;
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        #meter-screen {
            display: none;
            text-align: center;
            width: 100%;
            padding: 20px;
        }

        .display-container {
            position: relative;
            margin-bottom: 40px;
        }

        #db-value {
            font-size: 140px;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums; /* Чтобы цифры не прыгали по ширине */
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .unit {
            font-size: 40px;
            color: #888888;
            font-weight: 400;
            margin-left: 10px;
        }

        /* Индикатор уровня громкости (полоска) */
        .bar-wrapper {
            width: 100%;
            max-width: 400px;
            height: 12px;
            background-color: #2a2a2a;
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        #db-bar {
            height: 100%;
            width: 0%;
            background-color: #4CAF50;
            border-radius: 10px;
            /* Плавная анимация изменения длины и цвета полоски */
            transition: width 0.1s ease-out, background-color 0.3s ease;
        }

        /* Сообщение об ошибке */
        #error-msg {
            color: #F44336;
            margin-top: 20px;
            font-size: 1.1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button class="btn" id="start-btn">Включить микрофон</button>
        <p>Нажмите, чтобы разрешить доступ к микрофону для измерения уровня шума</p>
        <div id="error-msg">Ошибка доступа к микрофону. Проверьте разрешения.</div>
    </div>

    <div id="meter-screen">
        <div class="display-container">
            <span id="db-value">0</span><span class="unit">дБ</span>
        </div>
        <div class="bar-wrapper">
            <div id="db-bar"></div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const meterScreen = document.getElementById('meter-screen');
        const dbValueElement = document.getElementById('db-value');
        const dbBarElement = document.getElementById('db-bar');
        const errorMsg = document.getElementById('error-msg');

        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        
        // Переменная для плавного сглаживания значений
        let smoothedDb = 0;

        // Запуск при клике на кнопку
        startBtn.addEventListener('click', async () => {
            try {
                // Запрашиваем доступ к микрофону
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // Скрываем стартовый экран и показываем табло
                startScreen.style.display = 'none';
                meterScreen.style.display = 'block';
                
                // Инициализируем аудио
                initAudio(stream);
            } catch (err) {
                console.error("Ошибка доступа к микрофону:", err);
                errorMsg.style.display = 'block';
            }
        });

        function initAudio(stream) {
            // Создаем аудиоконтекст (с поддержкой старых браузеров Safari)
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Создаем анализатор
            analyser = audioContext.createAnalyser();
            
            // Настройки анализатора
            // fftSize определяет размер буфера, чем больше - тем точнее, но медленнее
            analyser.fftSize = 2048; 
            
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Float32Array(bufferLength);
            
            // Подключаем микрофон к анализатору
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            
            // Запускаем цикл обновления
            updateMeter();
        }

        function updateMeter() {
            // Получаем сырые данные с микрофона
            analyser.getFloatTimeDomainData(dataArray);

            // Вычисляем RMS (Root Mean Square) - среднеквадратичное значение амплитуды
            let sumSquares = 0.0;
            for (let i = 0; i < dataArray.length; i++) {
                sumSquares += dataArray[i] * dataArray[i];
            }
            const rms = Math.sqrt(sumSquares / dataArray.length);

            // Конвертируем RMS в децибелы
            let targetDb = 0;
            if (rms > 0) {
                // Математически 0 dBFS (полная шкала) = максимум.
                // Прибавляем константу (например, 100), чтобы имитировать стандартный 
                // измеритель звукового давления (SPL). Это приблизительная калибровка.
                const dbfs = 20 * Math.log10(rms);
                targetDb = Math.max(0, dbfs + 100); 
            }

            // Сглаживаем значения, чтобы цифры не "мельтешили" слишком быстро
            // 0.85 - вес старого значения, 0.15 - вес нового (чем больше первое число, тем плавнее)
            smoothedDb = smoothedDb * 0.85 + targetDb * 0.15;
            
            // Округляем для вывода на экран
            const finalDb = Math.round(smoothedDb);

            // Обновляем текст
            dbValueElement.textContent = finalDb;

            // Обновляем визуальную полоску
            // Считаем 120 дБ как 100% ширины (болевой порог)
            const percent = Math.min(100, (finalDb / 120) * 100);
            dbBarElement.style.width = `${percent}%`;

            // Меняем цвет полоски в зависимости от громкости
            if (finalDb < 60) {
                dbBarElement.style.backgroundColor = '#4CAF50'; // Зеленый (тихо)
            } else if (finalDb < 85) {
                dbBarElement.style.backgroundColor = '#FFC107'; // Желтый (нормально/громко)
            } else {
                dbBarElement.style.backgroundColor = '#F44336'; // Красный (очень громко)
            }

            // Запрашиваем следующий кадр анимации
            requestAnimationFrame(updateMeter);
        }
    </script>
</body>
</html>
